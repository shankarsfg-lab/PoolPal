name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reorganize Project Structure
        run: |
          mkdir -p src/context src/components src/lib supabase/migrations android/app/src/main/java/com/poolpal/app android/app/src/main/res/layout android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi-v26 android/gradle/wrapper
          
          # Move context modules
          mv AuthContext.tsx src/context/ 2>/dev/null || true
          
          # Move component modules
          mv AuthScreen.tsx DriverDashboard.tsx FindRides.tsx Header.tsx MyRequests.tsx NotificationBell.tsx OfferRide.tsx RequestSeatModal.tsx ui.tsx src/components/ 2>/dev/null || true
          
          # Move Supabase lib file
          mv supabase.ts src/lib/ 2>/dev/null || true
          
          # Move top-level React files
          mv App.tsx index.css main.tsx vite-env.d.ts src/ 2>/dev/null || true
          
          # Move database migrations
          mv 2026*.sql supabase/migrations/ 2>/dev/null || true
          
          # Move Android config & Gradle files
          mv AndroidManifest.xml android/app/src/main/ 2>/dev/null || true
          mv MainActivity.java android/app/src/main/java/com/poolpal/app/ 2>/dev/null || true
          mv activity_main.xml android/app/src/main/res/layout/ 2>/dev/null || true
          mv strings.xml styles.xml android/app/src/main/res/values/ 2>/dev/null || true
          mv ic_launcher*.xml android/app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
          mv build.gradle capacitor.build.gradle capacitor.settings.gradle settings.gradle variables.gradle proguard-rules.pro file_paths.xml android/ 2>/dev/null || true
          mv gradlew gradlew.bat android/ 2>/dev/null || true
          mv gradle-wrapper.jar gradle-wrapper.properties android/gradle/wrapper/ 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolpal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
